<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment History | DigitalPay Awareness</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #10213a;
        }

        .navbar {
            background: white;
            padding: 18px 7%;
            border-bottom: 1px solid #e4eaf2;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: #155eef;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: #10213a;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            color: #155eef;
            margin-bottom: 8px;
        }

        .title p {
            color: #617086;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #e4eaf2;

            box-shadow:
                0 10px 30px
                rgba(18,46,82,.08);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .clear-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .payment {
            border: 1px solid #e1e7ef;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fafcff;
        }

        .payment-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .receiver {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            background: #d1e7dd;
            color: #0f5132;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail {
            padding: 8px 0;
        }

        .label {
            color: #718096;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .value {
            font-weight: bold;
        }

        .amount {
            color: #155eef;
            font-size: 19px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #718096;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .pay-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            background: #155eef;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #718096;
        }

        @media(max-width:650px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .payment-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        DigitalPay Awareness
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="payment.html">
            Make Payment
        </a>

    </div>

</nav>



<div class="container">

    <div class="title">

        <h1>
            🧾 Payment History
        </h1>

        <p>
            Your do payment transactions
        </p>

    </div>


    <div class="card">

        <div class="top">

            <h2>
                Recent Transactions
            </h2>

            <button
                class="clear-btn"
                onclick="clearHistory()"
            >
                🗑 Clear History
            </button>

        </div>


        <div id="history"></div>

    </div>

</div>



<footer>

    <p>
        Digital Payment Awareness |
        College Project
    </p>

    <p>
        <small>
            This is a do. No real money is transferred.
        </small>
    </p>

</footer>



<script>


/* ==========================================
   LOAD PAYMENT HISTORY
========================================== */

function loadHistory() {

    const history =
        document.getElementById("history");


    /*
       Get saved payments from browser
    */

    const payments =
        JSON.parse(
            localStorage.getItem("demoPayments")
        ) || [];


    console.log(
        "Payments found:",
        payments
    );


    history.innerHTML = "";


    /* ==========================================
       NO PAYMENTS
    ========================================== */

    if (payments.length === 0) {

        history.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <h3>
                    No Payment History
                </h3>

                <p>
                    No do payment has been
                    recorded yet.
                </p>

                <a
                    href="payment.html"
                    class="pay-btn"
                >
                    💳 Make Do Payment
                </a>

            </div>

        `;

        return;
    }


    /* ==========================================
       DISPLAY PAYMENTS
    ========================================== */

    payments.forEach(function(payment) {

        const item =
            document.createElement("div");


        item.className = "payment";


        item.innerHTML = `

            <div class="payment-top">

                <div class="receiver">

                    🏪
                    ${escapeHTML(payment.receiver)}

                </div>

                <div class="status">

                    ✓ ${escapeHTML(payment.status)}

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <div class="label">
                        Transaction ID
                    </div>

                    <div class="value">

                        ${escapeHTML(payment.id)}

                    </div>

                </div>



                <div class="detail">

                    <div class="label">
                        Amount
                    </div>

                    <div class="value amount">

                        ₹${Number(payment.amount).toFixed(2)}

                    </div>

                </div>



                <div class="detail">

                    <div class="label">
                        Sender
                    </div>

                    <div class="value">

                        ${escapeHTML(payment.name)}

                    </div>

                </div>



                <div class="detail">

                    <div class="label">
                        UPI ID
                    </div>

                    <div class="value">

                        ${escapeHTML(payment.upi)}

                    </div>

                </div>



                <div class="detail">

                    <div class="label">
                        Payment Method
                    </div>

                    <div class="value">

                        ${escapeHTML(payment.method)}

                    </div>

                </div>



                <div class="detail">

                    <div class="label">
                        Date & Time
                    </div>

                    <div class="value">

                        ${escapeHTML(payment.date)}

                    </div>

                </div>


            </div>

        `;


        history.appendChild(item);

    });

}



/* ==========================================
   CLEAR HISTORY
========================================== */

function clearHistory() {

    const payments =
        JSON.parse(
            localStorage.getItem("demoPayments")
        ) || [];


    if (payments.length === 0) {

        alert(
            "Payment history is already empty."
        );

        return;
    }


    const answer =
        confirm(
            "Are you sure you want to delete all payment history?"
        );


    if (answer) {

        localStorage.removeItem(
            "demoPayments"
        );


        loadHistory();


        alert(
            "Payment history deleted."
        );

    }

}



/* ==========================================
   SECURITY FUNCTION
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;

}



/* ==========================================
   START
========================================== */

loadHistory();


</script>

</body>

</html>
